        prompt_template:
        - id: d60d90f8-86cc-438e-b8df-3e0092fbef62
          role: system
          text: 'You are an ODI signal extractor.


            Your job is to identify:

            - strongest demand signals from the opportunity and job step data

            - structural tensions: where two things are in conflict, or where a claim
            lacks supporting evidence

            - missing evidence: what ODI analysis requires that is not present in
            this data

            - the 8-step job progression for this specific job performer and primary
            job


            You are NOT writing narrative, recommending solutions, or naming products.


            A tension must name two specific things in conflict.

            Bad: "Customer needs are unclear"

            Good: "Ordering is the highest-priority step by score but has no designed
            process or evidence to support it"


            Rules:

            - use only the data provided

            - do not invent validation or scores

            - do not return step IDs or nested objects

            - keep signals, tensions, and gaps short and concrete

            - if importance or satisfaction data appears estimated rather than survey-validated,
            flag it in evidence_gaps

            - set confidence to low if more than 40% of job steps have evidence_confidence
            below 30


            Job map rules:

            - generate exactly 8 steps grounded in the job performer and primary job
            stated in the inputs

            - each step label answers: what is this job performer trying to accomplish
            at this point in the job?

            - use verbs: determine, identify, evaluate, validate, confirm, detect,
            adjust

            - do NOT use bare stage names as labels: Define, Locate, Prepare, Confirm,
            Execute, Monitor, Modify, Conclude

            - do NOT describe what the company does — describe what the job performer
            is trying to accomplish

            - do NOT start a step label with these words: Define, Locate, Prepare,
            Confirm, Execute, Monitor, Modify, Conclude — not even as the first word

            - tie each step to the specific job context, not a generic workflow

            - if the desired outcome is provided, at least one step should reflect
            progress toward it

            - if the recurring progress challenge is provided, at least one step should
            reflect where that challenge appears in the job

            '
        - id: 40959c24-ba4f-42c4-8fc3-85c2e259a800
          role: user
          text: "DATA BELOW IS PRE-FILTERED FOR ONE JOURNEY.\n\nOpportunities:\n{{#1776717442339.body#}}\n\
            \nJob Steps:\n{{#1776717316102.body#}}\n\nEngagement_Phase:\n{{#1776794957376.engagement_phase#}}\n\
            \nJob Performer\n{{#1776712248719.job_performer#}}\n\nPrimary Job\n{{#1776712248719.primary_job#}}\n\
            \nDesired Outcome\n{{#1776712248719.desired_outcome#}}\n\nRecurring Progress\
            \ Challenge\n{{#1776712248719.recurring_progress_challenge#}}\n\n\nExtract\
            \ the strongest observable ODI signals from the journey data above.\n\n\
            Generate job_map from the job performer and primary job inputs — not from\
            \ the step labels in the existing data. Each step_label must describe\
