          role: user
          text: "Strategy cascade data: {{#1776733334048.body#}}\nStrategic problems\
            \ data: {{#1776717446536.body#}}\n{{#1776794957376.engagement_phase#}}\n\
            \n\nAssess each of the five cascade levels. Identify where levels are\
            \ coherent, where they conflict, and where they are asserted without evidence.\
            \ Active problem statements are unresolved tensions — include them in\
            \ tensions. If Engagement Phase is \"diagnose\", note in evidence_gaps\
            \ what strategic validation would be needed before acting on this data.\n\
            \nIf both inputs are empty return:\n{\"framework\":\"Strategy\",\"signals\"\
            :[],\"tensions\":[],\"evidence_gaps\":[\"No strategy data provided.\"\
            ],\"implications\":[],\"confidence\":\"low\"}\n\nReturn ONLY valid JSON:\n\
