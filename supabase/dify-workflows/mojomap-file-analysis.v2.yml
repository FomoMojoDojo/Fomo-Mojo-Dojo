      - data:
          code: |
            function parseJson(v) {
              if (typeof v !== "string") return v || {};
              try { return JSON.parse(v); } catch { return {}; }
            }

            function normalizeFramework(v, expected) {
              const parsed = parseJson(v);
              const framework = typeof parsed.framework === "string" ? parsed.framework : expected;
              const findings = Array.isArray(parsed.findings) ? parsed.findings : [];
              return { framework, findings };
            }

            function main({ grounding, april_dunford, jtbd, odi, strategy_cascade, teresa_torres }) {
              const g = parseJson(grounding);

              return {
                summary: typeof g.summary === "string" ? g.summary : "",
                evidence: JSON.stringify(Array.isArray(g.evidence) ? g.evidence : []),
                document_signals: JSON.stringify(Array.isArray(g.document_signals) ? g.document_signals : []),
                missing_information: JSON.stringify(Array.isArray(g.missing_information) ? g.missing_information : []),
                grounding_confidence: typeof g.confidence === "string" ? g.confidence : "low",
                grounding_confidence_reason: typeof g.confidence_reason === "string" ? g.confidence_reason : "",
                framework_results: JSON.stringify([
                  normalizeFramework(april_dunford, "april_dunford"),
                  normalizeFramework(jtbd, "jtbd"),
                  normalizeFramework(odi, "odi"),
                  normalizeFramework(strategy_cascade, "strategy_cascade"),
                  normalizeFramework(teresa_torres, "teresa_torres"),
                ]),
              };
            }
