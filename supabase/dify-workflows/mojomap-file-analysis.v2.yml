      - data:
          code: |
            function parseJson(value) {
              if (typeof value !== "string") return value;
              const trimmed = value.trim();
              if (!trimmed) return value;
              try {
                return JSON.parse(trimmed);
              } catch {
                return value;
              }
            }

            function asArray(value) {
              const parsed = parseJson(value);
              return Array.isArray(parsed) ? parsed : [];
            }

            function asStringArray(value) {
              return asArray(value)
                .map((item) => String(item || "").trim())
                .filter(Boolean);
            }

            function asObjectArray(value) {
              return asArray(value).filter((item) => item && typeof item === "object" && !Array.isArray(item));
            }

            function normalizeConfidence(value, fallback = "low") {
              const normalized = String(value || fallback).trim().toLowerCase();
              return ["high", "medium", "low"].includes(normalized) ? normalized : fallback;
            }

            function normalizeSuggestedAreas(value) {
              const allowed = new Set([
                "positioning",
                "job_map",
                "opportunities",
                "strategy",
                "routes",
              ]);

              if (typeof value === "string") {
                return value
                  .split("|")
                  .map((item) => item.trim())
                  .filter((item) => allowed.has(item));
              }

              return asStringArray(value).filter((item) => allowed.has(item));
            }

            function normalizeFrameworkResults(value) {
              return asObjectArray(value).map((framework) => ({
                framework: String(framework.framework || "").trim(),
                findings: Array.isArray(framework.findings)
                  ? framework.findings
                      .filter((f) => f && typeof f === "object" && !Array.isArray(f))
                      .map((f) => ({
                        claim: String(f.claim || "").trim(),
                        evidence: String(f.evidence || "").trim(),
                        confidence: normalizeConfidence(f.confidence, "low"),
                        mojo_area: String(f.mojo_area || "").trim(),
                        suggested_update: String(f.suggested_update || "").trim(),
                        risk_if_ignored: String(f.risk_if_ignored || "").trim(),
                      }))
                      .filter((f) => f.claim)
                  : [],
              })).filter((framework) => framework.framework);
            }

            function normalizePositioningUpdates(value) {
              const allowedFields = new Set([
                "target_customer",
                "category",
                "alternatives",
                "unique_attributes",
                "value",
                "proof",
              ]);

              return asObjectArray(value)
                .map((item) => ({
                  field: String(item.field || "").trim(),
                  current_issue: String(item.current_issue || "").trim(),
                  suggested_update: String(item.suggested_update || "").trim(),
                  evidence: String(item.evidence || "").trim(),
                  confidence: normalizeConfidence(item.confidence, "low"),
                }))
                .filter((item) => allowedFields.has(item.field) && item.suggested_update);
            }

            function normalizeJobSteps(value) {
              return asObjectArray(value)
                .map((item) => ({
                  step_label: String(item.step_label || "").trim(),
                  step_description: String(item.step_description || "").trim(),
                  evidence: String(item.evidence || "").trim(),
                  confidence: normalizeConfidence(item.confidence, "low"),
                }))
                .filter((item) => item.step_label);
            }

            function normalizeCandidateNeeds(value) {
              return asObjectArray(value)
                .map((item) => ({
                  desired_outcome: String(item.desired_outcome || "").trim(),
                  importance: Number.isFinite(Number(item.importance)) ? Math.max(0, Math.min(10, Math.round(Number(item.importance)))) : 0,
                  satisfaction: Number.isFinite(Number(item.satisfaction)) ? Math.max(0, Math.min(10, Math.round(Number(item.satisfaction)))) : 0,
                  evidence: String(item.evidence || "").trim(),
                  confidence: normalizeConfidence(item.confidence, "low"),
                }))
                .filter((item) => item.desired_outcome);
            }

            function normalizeCandidateOutcomes(value) {
              return asObjectArray(value)
                .map((item) => ({
                  outcome: String(item.outcome || "").trim(),
                  related_opportunities: Array.isArray(item.related_opportunities)
                    ? item.related_opportunities.map((v) => String(v || "").trim()).filter(Boolean)
                    : [],
                  evidence: String(item.evidence || "").trim(),
                  confidence: normalizeConfidence(item.confidence, "low"),
                }))
                .filter((item) => item.outcome);
            }

            function normalizePossibleRoutes(value) {
              return asObjectArray(value)
                .map((item) => ({
                  title: String(item.title || "").trim(),
                  why_this_could_matter: String(item.why_this_could_matter || "").trim(),
                  linked_opportunity: String(item.linked_opportunity || "").trim(),
                  evidence: String(item.evidence || "").trim(),
                  confidence: normalizeConfidence(item.confidence, "low"),
                }))
                .filter((item) => item.title);
            }

            function normalizeExperiments(value) {
              return asObjectArray(value)
                .map((item) => ({
                  experiment: String(item.experiment || "").trim(),
                  what_it_tests: String(item.what_it_tests || "").trim(),
                  evidence: String(item.evidence || "").trim(),
                }))
                .filter((item) => item.experiment);
            }

            function normalizeContradictions(value) {
              return asObjectArray(value)
                .map((item) => ({
                  claim: String(item.claim || "").trim(),
                  conflicts_with: String(item.conflicts_with || "").trim(),
                  evidence: String(item.evidence || "").trim(),
                }))
                .filter((item) => item.claim);
            }

            function main({ arg1 }) {
              const data = typeof arg1 === "string" ? (parseJson(arg1) || {}) : (arg1 || {});

              const summary = String(data.summary || "").trim();
              const evidence = asStringArray(data.evidence);
              const frameworkResults = normalizeFrameworkResults(data.framework_results);
              const suggestedAreas = normalizeSuggestedAreas(data.suggested_areas);
              const candidatePositioningUpdates = normalizePositioningUpdates(data.candidate_positioning_updates);
              const candidateJobSteps = normalizeJobSteps(data.candidate_job_steps);
              const candidateNeeds = normalizeCandidateNeeds(data.candidate_needs);
              const candidateOutcomes = normalizeCandidateOutcomes(data.candidate_outcomes);
              const possibleRoutes = normalizePossibleRoutes(data.possible_routes);
              const experimentsToRun = normalizeExperiments(data.experiments_to_run);
              const contradictions = normalizeContradictions(data.contradictions);
              const questionsToVerify = asStringArray(data.questions_to_verify);
              const confidence = normalizeConfidence(data.confidence, "low");
              const confidenceReason = String(data.confidence_reason || "").trim();

              const result = [
                "THIS FILE SUGGESTS:",
                summary || "No file-specific summary was produced.",
                "",
                "Evidence:",
                ...(evidence.length ? evidence.map((item) => `- ${item}`) : ["- No concrete evidence extracted."]),
                "",
                "Frameworks:",
                ...(frameworkResults.length
                  ? frameworkResults.map((f) => `- ${f.framework}: ${f.findings.length} finding(s)`)
                  : ["- No framework findings returned."]),
                "",
                "Contradictions:",
                ...(contradictions.length
                  ? contradictions.map((item) => `- ${item.claim}`)
                  : ["- None identified."]),
                "",
                `Confidence: ${confidence}`,
                `Why: ${confidenceReason || "Confidence reason missing."}`,
              ].join("\n");

              return {
                result,
                summary,
                evidence: JSON.stringify(evidence),
                framework_results: JSON.stringify(frameworkResults),
                suggested_areas: suggestedAreas.join("|"),
                candidate_positioning_updates: JSON.stringify(candidatePositioningUpdates),
                candidate_job_steps: JSON.stringify(candidateJobSteps),
                candidate_needs: JSON.stringify(candidateNeeds),
                candidate_outcomes: JSON.stringify(candidateOutcomes),
                possible_routes: JSON.stringify(possibleRoutes),
                experiments_to_run: JSON.stringify(experimentsToRun),
                contradictions: JSON.stringify(contradictions),
                questions_to_verify: JSON.stringify(questionsToVerify),
                confidence,
                confidence_reason: confidenceReason,
              };
            }
