          \ => ({\n      field: String(item.field || \"\").trim(),\n      current_issue:\
          \ String(item.current_issue || \"\").trim(),\n      suggested_update: String(item.suggested_update\
          \ || \"\").trim(),\n      evidence: String(item.evidence || \"\").trim(),\n\
          \      confidence: normalizeConfidence(item.confidence, \"low\"),\n    }))\n\
          \    .filter((item) => allowedFields.has(item.field) && item.suggested_update);\n\
          }\n\nfunction normalizeJobSteps(value) {\n  return asObjectArray(value)\n\
          \    .map((item) => ({\n      step_label: String(item.step_label || \"\"\
          ).trim(),\n      step_description: String(item.step_description || \"\"\
          ).trim(),\n      evidence: String(item.evidence || \"\").trim(),\n     \
          \ confidence: normalizeConfidence(item.confidence, \"low\"),\n    }))\n\
          \    .filter((item) => item.step_label);\n}\n\nfunction normalizeCandidateNeeds(value)\
          \ {\n  return asObjectArray(value)\n    .map((item) => ({\n      desired_outcome:\
          \ String(item.desired_outcome || \"\").trim(),\n      importance: Number.isFinite(Number(item.importance))\
          \ ? Math.max(0, Math.min(10, Math.round(Number(item.importance)))) : 0,\n\
          \      satisfaction: Number.isFinite(Number(item.satisfaction)) ? Math.max(0,\
          \ Math.min(10, Math.round(Number(item.satisfaction)))) : 0,\n      evidence:\
          \ String(item.evidence || \"\").trim(),\n      confidence: normalizeConfidence(item.confidence,\
          \ \"low\"),\n    }))\n    .filter((item) => item.desired_outcome);\n}\n\n\
          function normalizeCandidateOutcomes(value) {\n  return asObjectArray(value)\n\
          \    .map((item) => ({\n      outcome: String(item.outcome || \"\").trim(),\n\
          \      related_opportunities: Array.isArray(item.related_opportunities)\n\
          \        ? item.related_opportunities.map((v) => String(v || \"\").trim()).filter(Boolean)\n\
          \        : [],\n      evidence: String(item.evidence || \"\").trim(),\n\
          \      confidence: normalizeConfidence(item.confidence, \"low\"),\n    }))\n\
          \    .filter((item) => item.outcome);\n}\n\nfunction normalizePossibleRoutes(value)\
          \ {\n  return asObjectArray(value)\n    .map((item) => ({\n      title:\
          \ String(item.title || \"\").trim(),\n      why_this_could_matter: String(item.why_this_could_matter\
          \ || \"\").trim(),\n      linked_opportunity: String(item.linked_opportunity\
          \ || \"\").trim(),\n      evidence: String(item.evidence || \"\").trim(),\n\
          \      confidence: normalizeConfidence(item.confidence, \"low\"),\n    }))\n\
          \    .filter((item) => item.title);\n}\n\nfunction normalizeExperiments(value)\
          \ {\n  return asObjectArray(value)\n    .map((item) => ({\n      experiment:\
          \ String(item.experiment || \"\").trim(),\n      what_it_tests: String(item.what_it_tests\
          \ || \"\").trim(),\n      evidence: String(item.evidence || \"\").trim(),\n\
          \    }))\n    .filter((item) => item.experiment);\n}\n\nfunction normalizeContradictions(value)\
          \ {\n  return asObjectArray(value)\n    .map((item) => ({\n      claim:\
          \ String(item.claim || \"\").trim(),\n      conflicts_with: String(item.conflicts_with\
          \ || \"\").trim(),\n      evidence: String(item.evidence || \"\").trim(),\n\
          \    }))\n    .filter((item) => item.claim);\n}\n\nfunction main({ arg1\
          \ }) {\n  const data = typeof arg1 === \"string\" ? (parseJson(arg1) ||\
          \ {}) : (arg1 || {});\n\n  const summary = String(data.summary || \"\").trim();\n\
          \  const evidence = asStringArray(data.evidence);\n  const frameworkResults\
          \ = normalizeFrameworkResults(data.framework_results);\n  const suggestedAreas\
          \ = normalizeSuggestedAreas(data.suggested_areas);\n  const candidatePositioningUpdates\
          \ = normalizePositioningUpdates(data.candidate_positioning_updates);\n \
          \ const candidateJobSteps = normalizeJobSteps(data.candidate_job_steps);\n\
          \  const candidateNeeds = normalizeCandidateNeeds(data.candidate_needs);\n\
          \  const candidateOutcomes = normalizeCandidateOutcomes(data.candidate_outcomes);\n\
          \  const possibleRoutes = normalizePossibleRoutes(data.possible_routes);\n\
          \  const experimentsToRun = normalizeExperiments(data.experiments_to_run);\n\
          \  const contradictions = normalizeContradictions(data.contradictions);\n\
          \  const questionsToVerify = asStringArray(data.questions_to_verify);\n\
          \  const confidence = normalizeConfidence(data.confidence, \"low\");\n \
          \ const confidenceReason = String(data.confidence_reason || \"\").trim();\n\
          \n  const result = [\n    \"THIS FILE SUGGESTS:\",\n    summary || \"No\
          \ file-specific summary was produced.\",\n    \"\",\n    \"Evidence:\",\n\
          \    ...(evidence.length ? evidence.map((item) => `- ${item}`) : [\"- No\
          \ concrete evidence extracted.\"]),\n    \"\",\n    \"Frameworks:\",\n \
