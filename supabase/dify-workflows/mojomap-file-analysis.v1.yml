          \ identified.\"]),\n    \"\",\n    `Confidence: ${confidence}`,\n    `Why:\
          \ ${confidenceReason || \"Confidence reason missing.\"}`,\n  ].join(\"\\\
          n\");\n\n  return {\n    result,\n    summary,\n    evidence: JSON.stringify(evidence),\n\
          \    framework_results: JSON.stringify(frameworkResults),\n    suggested_areas:\
