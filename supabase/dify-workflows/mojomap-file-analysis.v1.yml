          \ JSON.stringify(experimentsToRun),\n    contradictions: JSON.stringify(contradictions),\n\
          \    questions_to_verify: JSON.stringify(questionsToVerify),\n    confidence,\n\
          \    confidence_reason: confidenceReason,\n  };\n}\n"
